version: '3'
services:


  util:
    build:
      context: ./
      dockerfile: config/util.docker
    container_name: 'util'
    volumes:
      - ./util-service:/app
      - ./dist/staging:/dist/staging
      - ./dist/prod:/dist/prod
      - ./dist/profile-editor:/dist/profile-editor
      - ./dist/prod-quartz:/dist/prod-quartz
      - ./dist/stage-quartz:/dist/stage-quartz
      - ./tmp:/tmp
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    restart: always
    # ports:
    #   - 5001:5001

  scriptshifter:
    image: lcnetdev/scriptshifter:latest
    volumes:
      - ./tmp:/tmp
    environment:
      - TXL_FLASK_SECRET=1234567890
    restart: always

  database:
    image: 'mongo:8'
    container_name: 'mongo' # give your container a name
    environment:
      - MONGO_INITDB_DATABASE=bfe2 # database name you want to make
      # We don't need to define root stuff because we are not using auth in the db
      #- MONGO_INITDB_ROOT_USERNAME=bfe2 # set your container root username
      #- MONGO_INITDB_ROOT_PASSWORD=bfe2 # set your contatner root password
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - ./config/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./database_files:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { var s = rs.status(); s.myState === 1 } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); false }"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: always

    # we don't need to expose the mongo server, it only talks internally to the other containers
    #ports:
    #  - '37017-37019:27017-27019'




  # ldpjs services removed - LDP functionality migrated to util-service

  dctap-dancer:
    build:
      context: ./dctap-dancer
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /marva/dancer/
    container_name: 'dctap-dancer'
    volumes:
      - ./dctap-dancer/data:/app/data
    environment:
      - ALLOW_DB_UPLOAD=${ALLOW_DB_UPLOAD:-false}
    restart: always
    # ports:
    #   - 3000:3000

  # CIP lookup (ISBN/barcode -> best OCLC record as MARC + BIBFRAME). Internal only:
  # it has no auth of its own, so it is reached through util (/cip-lookup) at
  # http://cip-lookup:8080 and is not exposed on the host or through nginx.
  cip-lookup:
    build:
      context: ./cip-lookup
      dockerfile: Dockerfile
    container_name: 'cip-lookup'
    volumes:
      # marc2bibframe2 lives outside the image: replace this directory to update the converter.
      # The stylesheet is read on every conversion, so no rebuild or restart is needed.
      - ${CIP_LOOKUP_M2B_DIR:-./cip-lookup/marc2bibframe2}:/opt/marc2bibframe2:ro
    environment:
      - WC_CLIENTID=${WC_CLIENTID:-}
      - WC_SECRET=${WC_SECRET:-}
      - CIP_LOOKUP_OCLC_TOKEN_URL=${CIP_LOOKUP_OCLC_TOKEN_URL:-https://oauth.oclc.org/token}
      - CIP_LOOKUP_OCLC_SEARCH_URL=${CIP_LOOKUP_OCLC_SEARCH_URL:-https://americas.discovery.api.oclc.org/worldcat/search/v2/brief-bibs}
      - CIP_LOOKUP_OCLC_MARC_URL=${CIP_LOOKUP_OCLC_MARC_URL:-https://metadata.api.oclc.org/worldcat/manage/bibs}
      - CIP_LOOKUP_OCLC_SCOPES=${CIP_LOOKUP_OCLC_SCOPES:-WorldCatMetadataAPI wcapi:view_bib wcapi:view_brief_bib}
      - CIP_LOOKUP_IDLOC_URL=${CIP_LOOKUP_IDLOC_URL:-https://id.loc.gov}
      # base for the placeholder Work/Instance URIs marc2bibframe2 mints
      - CIP_LOOKUP_M2B_BASEURI=${CIP_LOOKUP_M2B_BASEURI:-http://example.org/}
      - CIP_LOOKUP_HTTP_TIMEOUT=${CIP_LOOKUP_HTTP_TIMEOUT:-20}
    restart: always

  reverse:
    container_name: reverse
    hostname: reverse
    depends_on:
      - 'util'
    image: nginx:stable-alpine
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist/prod:/prod
      - ./dist/staging:/staging
      - ./dist/profile-editor:/profile-editor
      - ./dist/prod-quartz:/prod-quartz
      - ./dist/prod-quartz:/srv/prod/marva
      - ./dist/stage-quartz:/stage-quartz
      - ./dist/stage-quartz:/srv/stage/marva
    ports:
      - 9401:8080
      - 9400:80
    restart: always
      # - 443:443
    # volumes:

